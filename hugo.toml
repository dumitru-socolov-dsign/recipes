baseURL = "/"
defaultContentLanguage = "ro"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = false
disableKinds = ["taxonomy", "term", "RSS"]

timeZone = "Europe/Dublin"

# Româna e limba implicită și stă în rădăcină; engleza stă sub /en/.
# Engleza nu e o traducere de fațadă: denumirile de produse și de raioane sunt cele folosite
# în magazinele de aici, fiindcă ăsta e motivul pentru care există limba a doua — lista de
# cumpărături trebuie să se potrivească cu ce scrie pe raft.
[languages]
  [languages.ro]
    locale = "ro-RO"
    label = "Română"
    direction = "ltr"
    title = "Bucătărie"
    weight = 1
    [languages.ro.params]
      description = "Rețete simple, gătit în serie, listă de cumpărături calculată."
      localeTag = "ro-RO"

  [languages.en]
    locale = "en-IE"
    label = "English"
    direction = "ltr"
    title = "Kitchen"
    weight = 2
    [languages.en.params]
      description = "Simple recipes, batch cooking, a shopping list that does the maths."
      localeTag = "en-IE"
    [languages.en.permalinks]
      [languages.en.permalinks.page]
        retete = "/recipes/:slug/"
      [languages.en.permalinks.section]
        retete = "/recipes/"

[params]
  themeColor = "#f6f4f0"
  themeColorDark = "#131211"

[outputs]
  home = ["HTML", "JSON", "SW"]
  page = ["HTML"]

[outputFormats.SW]
  mediaType = "text/javascript"
  baseName = "sw"
  isPlainText = true
  notAlternative = true
  rel = "serviceworker"

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "app"
  isPlainText = true

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[minify]
  disableXML = true
  [minify.tdewolff.html]
    keepQuotes = true

# Șabloanele folosesc `hugo.Data`, care există abia din 0.156.0. Fără garda asta,
# o versiune mai veche eșuează cu „can't evaluate field Data in type interface {}",
# care nu spune nimănui nimic. Așa, Hugo refuză din start, cu mesaj clar.
[module]
  [module.hugoVersion]
    min = "0.156.0"
    extended = true

[build]
  writeStats = false

[caches.images]
  dir = ":cacheDir/images"
