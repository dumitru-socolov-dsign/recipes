# Bază de ingrediente.
# per100g = valori pentru 100 g de produs CRUD, așa cum se cumpără.
#   kcal · protein g · fat g · carbs g · fibre g · sodium mg · potassium mg · phosphorus mg
#   `carbs` sunt carbohidrați disponibili (fără fibre), ca pe etichetele europene.
# yield = fracțiunea comestibilă (os, coajă, pierdere la curățat). 1.0 = totul se mănâncă.
# aisle = raionul din magazin (vezi stores.yaml)
# k_high / p_high = marchez sursele importante de potasiu / fosfor, pentru avertismentele din UI
#
# Planul nu conține crupe, făinoase, cartofi și nici alte rădăcinoase amidonoase.
# Caloriile vin din grăsime; legumele sunt acolo pentru volum, fibre și gust, în cantități mici.

