# Prețuri de referință — Irlanda, EUR.
#
# Sursa de adevăr pentru costurile afișate în site. Fiecare intrare are `updated` și `source`,
# ca UI-ul să poată spune cinstit cât de vechi e un preț.
#
#   source: baseline  → estimare de pornire, nu preț citit din magazin
#   source: scraped   → citit automat de `npm run prices:refresh` (rulează local)
#   source: manual    → introdus de tine după ce l-ai văzut pe raft (cel mai de încredere)
#
# `pack` = cantitatea reală în care se vinde produsul. Lista de cumpărături rotunjește
# în sus la pachete întregi și îți arată cât rămâne.
# `price` = prețul unui pachet, nu prețul pe kilogram.

